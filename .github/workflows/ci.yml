name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Headless runners must never drive a real display / mouse / keyboard. The
# controller treats these exactly like a command-line-only OS, so CI doubles as
# the headless regression test.
env:
  NEURO_HEADLESS: "1"
  PYAUTOGUI_FAILSAFE: "0"

jobs:
  repo-checks:
    name: Repository checks (JSON, catalog, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: python3 desktop/tools/ci/repo_checks.py

  build-and-test:
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The server needs no cgo. Test binaries linked through the external C
      # linker fail to load on current macOS runners ("missing LC_UUID"), so
      # these steps build without cgo. The race detector needs cgo, so that
      # step turns it back on.
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      # ---------------------------------------------------------------
      # Go server: required.
      # ---------------------------------------------------------------
      # Run inside the module and let gofmt walk it: `mapfile` does not exist in
      # the bash that ships with macOS, and `find` on Windows can be a different
      # program. This form works in every runner's bash.
      - name: Go format check
        working-directory: desktop/apps/neuro-integration
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go build
        working-directory: desktop/apps/neuro-integration
        run: go build ./...

      - name: Go vet
        working-directory: desktop/apps/neuro-integration
        run: go vet ./...

      - name: Go tests (neuro-integration)
        working-directory: desktop/apps/neuro-integration
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee /tmp/go-test.log
          status=${PIPESTATUS[0]}
          # On failure, the last lines of the output go into an annotation. The run's
          # page and API show it without the raw log (which is not always downloadable).
          if [ "$status" != "0" ]; then
            tail -n 60 /tmp/go-test.log > /tmp/go-test-tail.txt
            msg="$(python3 -c "import sys; print(sys.stdin.read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))" < /tmp/go-test-tail.txt)"
            echo "::error title=go test output (last 60 lines)::${msg}"
          fi
          exit "$status"

      # The server has OS-specific branches (paths, platform keys, tray/shell
      # hints). Compiling for the three shipped platforms on every change is how
      # a Windows-only syntax/API mistake is caught without a Windows box.
      # TEMPORARY (remove once the macOS and Windows Go test failure is fixed):
      # posts the tail of the failing test output to the PR, because the raw log
      # is not downloadable from outside GitHub.
      - name: TEMP post the failing Go test output to the PR
        if: failure() && github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tail -n 120 /tmp/go-test.log > /tmp/tail.txt 2>/dev/null || echo "no log" > /tmp/tail.txt
          {
            echo "CI debug for ${{ matrix.os }} (temporary): every failure, then the last 120 lines of go test"
            echo '```'
            grep -E -- '--- FAIL|^FAIL|panic:|signal:|dyld' /tmp/go-test.log | head -80 || true
            echo "--- tail ---"
            cat /tmp/tail.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md || true

      - name: Go cross-compile (windows, darwin, linux)
        working-directory: desktop/apps/neuro-integration
        shell: bash
        run: |
          set -euo pipefail
          for target in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            echo "building $goos/$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -o /tmp/nd-server-"$goos"-"$goarch" .
          done

      # The race detector needs cgo, which only the Linux runner provides by
      # default. This is where the concurrent executor-hub / relay code is
      # actually exercised.
      - name: Go tests with the race detector
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop/apps/neuro-integration
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      # ---------------------------------------------------------------
      # Python controller: required, and deliberately run twice below.
      # ---------------------------------------------------------------
      - name: Python unit tests (parser only — no pyautogui display)
        run: python -m unittest discover desktop/backend/python/tests -t desktop/backend/python -v
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
          NEURO_HEADLESS: "1"

      - name: Ollama neuro tester unit tests
        working-directory: desktop/tools/ollama-neuro
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest test_brain.py -v

      - name: Frontend build
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      # The bridge serves the bundle from /ui/, so every asset URL must stay
      # relative. An absolute "/assets/..." URL breaks the dashboard there.
      - name: Frontend bundle uses relative asset URLs
        shell: bash
        run: |
          if ! grep -q 'src="./assets/' desktop/frontend/dist/index.html; then
            echo "dist/index.html does not reference a relative bundle:"
            cat desktop/frontend/dist/index.html
            exit 1
          fi


  # The server and the agent are two languages and two processes; a unit test on
  # each side cannot see a protocol regression between them. This job starts
  # both for real and asks the dashboard what it sees.
  agent-e2e:
    name: Server + agent end to end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Build the server
        working-directory: desktop/apps/neuro-integration
        run: go build -o /tmp/neuro-integration .

      - name: Start the server
        env:
          NEURO_HEADLESS: "1"
          NEURO_EXECUTOR_LISTEN: 127.0.0.1:9876
          NEURO_ADMIN_LISTEN: 127.0.0.1:8399
          NEURO_PERMISSIONS_FILE: ${{ runner.temp }}/permissions.json
          NEURO_SHELL_ALLOWLIST: echo
        run: |
          cp desktop/apps/neuro-integration/permissions.example.json "$NEURO_PERMISSIONS_FILE"
          nohup /tmp/neuro-integration --ws-url ws://127.0.0.1:8000 > /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8399/health >/dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "server did not come up:"; cat /tmp/server.log; exit 1

      - name: Start the agent and check that the server sees it
        env:
          NEURO_HEADLESS: "1"
          PYTHONPATH: desktop/backend/python
        run: |
          set -euo pipefail
          python -m controller.agent --bridge 127.0.0.1:9876 > /tmp/agent.log 2>&1 &
          for _ in $(seq 1 30); do
            status="$(curl -fsS http://127.0.0.1:8399/api/status)"
            if echo "$status" | grep -q '"connected": *true'; then
              echo "$status" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['executor']['connected'] is True; print('executor connected, profile:', d['executor'].get('remote'))"
              exit 0
            fi
            sleep 0.5
          done
          echo "the agent never showed up as connected"; cat /tmp/agent.log; cat /tmp/server.log; exit 1

      - name: The agent's telemetry is what the dashboard shows
        run: |
          curl -fsS http://127.0.0.1:8399/api/actions | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['actions']), 'actions exposed')"

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- server ---"; tail -50 /tmp/server.log || true
          echo "--- agent ---"; tail -50 /tmp/agent.log || true

  python-cli-only:
    name: Python controller on a CLI-only install (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Intentionally no pip install: this is the "headless, command-line-only
      # OS" case, where the GUI libraries are absent. The controller must still
      # import, load its policy and run shell commands.
      - name: Run the test suite without GUI dependencies
        env:
          PYTHONPATH: desktop/backend/python
          NEURO_HEADLESS: "1"
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: python -m unittest discover desktop/backend/python/tests -t desktop/backend/python -v

  # ---------------------------------------------------------------
  # Neuro Relay host (Go, `neuro-integration relay`). The protocol tests run
  # the bridge's own relay client against the host; the smoke test runs the
  # built binary the way an operator would.
  # ---------------------------------------------------------------
  relay-host:
    name: Neuro Relay host (protocol tests and a live smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Relay protocol tests (race detector)
        working-directory: desktop/apps/neuro-integration
        run: go test -race -count=1 -run 'Relay' -v ./

      - name: Build the bridge binary
        working-directory: desktop/apps/neuro-integration
        run: go build -o /tmp/nd-bridge .

      - name: The relay refuses the upstream sample token
        run: |
          set +e
          NEURO_RELAY_AUTH_TOKEN=super-secret-token timeout 15 /tmp/nd-bridge relay \
            --listen 127.0.0.1:18765 --health 127.0.0.1:18766 --token-file /tmp/relay-token-refused
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" = "2"

      - name: Start the relay with a generated token and check /health
        run: |
          set -euo pipefail
          rm -f /tmp/relay-token-ci
          /tmp/nd-bridge relay --listen 127.0.0.1:18765 --health 127.0.0.1:18766 \
            --token-file /tmp/relay-token-ci > /tmp/relay.log 2>&1 &
          echo $! > /tmp/relay.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18766/health > /tmp/health.json; then break; fi
            sleep 0.25
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          test "$(stat -c %a /tmp/relay-token-ci)" = "600"
          grep -q "generated one" /tmp/relay.log

      - name: Stop the relay
        if: always()
        run: |
          if [ -f /tmp/relay.pid ]; then kill "$(cat /tmp/relay.pid)" || true; fi

      - name: Relay log on failure
        if: failure()
        run: cat /tmp/relay.log || true

  # ---------------------------------------------------------------
  # MCP bridge: fake-server tests on every run, and the real npm reference
  # server (@modelcontextprotocol/server-memory, pinned) through npx.
  # ---------------------------------------------------------------
  mcp:
    name: MCP bridge (fake server, then the real reference server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: MCP tests with the fake server (race detector)
        working-directory: desktop/apps/neuro-integration
        run: go test -race -count=1 -run 'MCP' -v ./

      - name: MCP test against the real npm reference server
        working-directory: desktop/apps/neuro-integration
        env:
          NDTEST_REAL_MCP: "1"
        run: go test -count=1 -run 'TestMCPRealReferenceServer' -v ./

  # ---------------------------------------------------------------
  # Vision: the bridge's client, and the nd-vision-server Python package.
  # ---------------------------------------------------------------
  vision:
    name: Vision (bridge client and nd-vision-server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Bridge vision client tests
        working-directory: desktop/apps/neuro-integration
        run: go test -count=1 -run 'Vision' -v ./

      - name: Install the optional image backend (Pillow)
        run: python -m pip install -q pillow

      - name: nd-vision-server tests
        working-directory: desktop/apps/nd-vision-server
        run: python -m unittest discover -s tests -t . -v

  # ---------------------------------------------------------------
  # Signed catalog: the shipped index must verify with the bridge's own
  # `catalog verify`, and the trust rules have their own tests.
  # ---------------------------------------------------------------
  catalog-verify:
    name: Signed catalog (verify the shipped index)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Build the bridge (it also contains the catalog tool)
        working-directory: desktop/apps/neuro-integration
        run: go build -o /tmp/nd-bridge .

      - name: Verify the shipped catalog signatures
        working-directory: desktop
        run: /tmp/nd-bridge catalog verify --index catalog/index.json --publishers catalog/publishers.json

      - name: Catalog trust and shipped-catalog tests
        working-directory: desktop/apps/neuro-integration
        run: go test -count=1 -run 'Catalog|Sign|Tamper|Publisher|Canonical|Keygen|Signing|Extension' -v ./

  # ---------------------------------------------------------------
  # Small-model eval: recorded weak-model calls with the verdict and the
  # corrective text they must get, plus the escape hatch and the example policy.
  # ---------------------------------------------------------------
  weak-model-eval:
    name: Small-model eval (recorded calls, escape hatch, example policy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Run the eval
        working-directory: desktop/apps/neuro-integration
        run: go test -count=1 -run 'WeakModel|RefusalsName|EscapeHatch|ResetOutcome|ExamplePolicy' -v ./

  # ---------------------------------------------------------------
  # Release bundle: build the dashboard and the bundle exactly as a release
  # does, then check that the server can serve the dashboard from the bundle
  # folder and that the shipped catalog verifies from inside it.
  # ---------------------------------------------------------------
  bundle:
    name: Release bundle (build, then serve the dashboard from it)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build the dashboard and the bundle
        working-directory: desktop
        env:
          NEURO_BUNDLE_SKIP_VENV: "1"
        run: |
          set -euo pipefail
          (cd frontend && npm ci && npm run build)
          ./scripts/bundle/prod.sh

      - name: The bundle has what the launcher needs
        working-directory: desktop/dist/neuro-desktop
        run: |
          set -euo pipefail
          test -x neuro-integration
          test -f start.sh && sh -n start.sh
          test -f permissions.json
          test -f frontend/index.html
          test -f catalog/index.json && test -f catalog/publishers.json
          ./neuro-integration catalog verify --index catalog/index.json --publishers catalog/publishers.json

      - name: Serve the dashboard from the bundle folder
        working-directory: desktop/dist/neuro-desktop
        run: |
          set -euo pipefail
          NEURO_ADMIN_LISTEN=127.0.0.1:8311 NEURO_EXECUTOR_LISTEN=127.0.0.1:9911 \
            NEURO_UI_DIR="$PWD/frontend" NEURO_PERMISSIONS_FILE="$PWD/permissions.json" \
            NEURO_AUDIT_LOG=/tmp/bundle-audit.log ./neuro-integration > /tmp/bundle-server.log 2>&1 &
          echo $! > /tmp/bundle-server.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8311/ui/ -o /tmp/ui.html; then break; fi
            sleep 0.25
          done
          grep -q 'src="./assets/' /tmp/ui.html
          curl -sf http://127.0.0.1:8311/api/runtime | grep -q '"state": "running"'

      - name: Stop the server
        if: always()
        run: |
          if [ -f /tmp/bundle-server.pid ]; then kill "$(cat /tmp/bundle-server.pid)" || true; fi

      - name: Server log on failure
        if: failure()
        run: cat /tmp/bundle-server.log || true

  # ---------------------------------------------------------------
  # Release gate: one check that branch protection can require. It fails if any
  # other job did not succeed, including jobs that were skipped.
  # ---------------------------------------------------------------
  release-gate:
    name: Release gate (every required job succeeded)
    if: always()
    needs: [repo-checks, build-and-test, agent-e2e, python-cli-only, relay-host, mcp, vision, catalog-verify, weak-model-eval, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = {name: r["result"] for name, r in results.items() if r["result"] != "success"}
          for name, r in sorted(results.items()):
              print(f"{name}: {r['result']}")
          if bad:
              print("not successful:", bad)
              sys.exit(1)
          print(f"all {len(results)} required jobs succeeded")
          PY
