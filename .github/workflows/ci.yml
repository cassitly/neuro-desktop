name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Headless runners must never drive a real display / mouse / keyboard. The
# controller treats these exactly like a command-line-only OS, so CI doubles as
# the headless regression test.
env:
  NEURO_HEADLESS: "1"
  PYAUTOGUI_FAILSAFE: "0"

jobs:
  repo-checks:
    name: Repository checks (JSON, catalog, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: python3 desktop/tools/ci/repo_checks.py

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: desktop/apps/neuro-integration/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      # ---------------------------------------------------------------
      # Rust executor: advisory.
      #
      # The bridge, controller and dashboard are verified below; the Rust
      # executor is huge and the checkout may not compile on every runner, so a
      # failure here is reported but does not red the whole pipeline. Remove
      # continue-on-error once the executor is confirmed building on all three
      # platforms.
      # ---------------------------------------------------------------
      - name: Rust format check
        continue-on-error: true
        run: cargo fmt --manifest-path desktop/apps/neuro-desktop/Cargo.toml -- --check

      - name: Rust unit tests (no display)
        continue-on-error: true
        run: cargo test --manifest-path desktop/apps/neuro-desktop/Cargo.toml
        env:
          # Ensure no accidental X11/Wayland use during unit tests.
          DISPLAY: ""
          WAYLAND_DISPLAY: ""

      # ---------------------------------------------------------------
      # Go bridge: required.
      # ---------------------------------------------------------------
      - name: Go format check
        shell: bash
        run: |
          mapfile -t files < <(find desktop/apps/neuro-integration -name '*.go' ! -path '*/dist/*')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go build
        working-directory: desktop/apps/neuro-integration
        run: go build ./...

      - name: Go vet
        working-directory: desktop/apps/neuro-integration
        run: go vet ./...

      - name: Go tests (neuro-integration)
        working-directory: desktop/apps/neuro-integration
        run: go test -count=1 ./...

      # The race detector needs cgo, which only the Linux runner provides by
      # default. This is where the concurrent executor-hub / relay code is
      # actually exercised.
      - name: Go tests with the race detector
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop/apps/neuro-integration
        run: go test -race -count=1 ./...

      # ---------------------------------------------------------------
      # Python controller: required, and deliberately run twice below.
      # ---------------------------------------------------------------
      - name: Python unit tests (parser only — no pyautogui display)
        run: python -m unittest discover desktop/backend/python/tests -t desktop/backend/python -v
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
          NEURO_HEADLESS: "1"

      - name: Ollama neuro tester unit tests
        working-directory: desktop/tools/ollama-neuro
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest test_brain.py -v

      - name: Frontend build
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      # process-handler: compile + unit tests only. Skip spawning GUI/desktop
      # binaries or any input simulation on headless CI runners.
      - name: Configure process-handler tests
        run: cmake -S desktop/apps/process-handler -B desktop/apps/process-handler/build-ci -DBUILD_TESTS=ON

      - name: Build process-handler tests
        run: cmake --build desktop/apps/process-handler/build-ci --config Release --parallel

      - name: Run process-handler unit tests
        run: ctest --test-dir desktop/apps/process-handler/build-ci -C Release --output-on-failure -E 'FullLifecycle'
        # FullLifecycle spawns real processes; keep message/validator unit tests.

  python-cli-only:
    name: Python controller on a CLI-only install (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Intentionally no pip install: this is the "headless, command-line-only
      # OS" case, where the GUI libraries are absent. The controller must still
      # import, load its policy and run shell commands.
      - name: Run the test suite without GUI dependencies
        env:
          PYTHONPATH: desktop/backend/python
          NEURO_HEADLESS: "1"
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: python -m unittest discover desktop/backend/python/tests -t desktop/backend/python -v
